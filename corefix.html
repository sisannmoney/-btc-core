<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTC CORE">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BTC CORE — Core Fix</title>
<style>
:root{
  --accent:#4cc9ff;
  --gold:#ffbf3f;
  --danger:#ff334f;
  --safeT:max(env(safe-area-inset-top),8px);
  --safeB:max(env(safe-area-inset-bottom),10px);
  --awaken:0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  background:#060708;color:white;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  overflow:hidden
}
body{position:fixed;inset:0}
button,input,select{font:inherit}
.app{
  position:relative;width:100%;height:100%;
  background:#000;overflow:hidden;
  isolation:isolate
}
.stage{
  position:absolute;
  left:50%;top:50%;
  width:max(100vw,calc(100vh * 941 / 1672));
  aspect-ratio:941 / 1672;
  transform:translate(-50%,-50%);
  overflow:hidden;
}
.bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:fill;
  user-select:none;-webkit-user-drag:none;
  transform:scale(calc(1 + var(--awaken)*0.006));
  filter:saturate(calc(1 + var(--awaken)*0.20)) brightness(calc(1 + var(--awaken)*0.06));
  transition:filter .25s ease,transform .25s ease
}
.shade{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.04),transparent 58%,rgba(0,0,0,.25)),
    radial-gradient(circle at 50% 37%,rgba(76,201,255,calc(.11*var(--awaken))),transparent 25%);
  z-index:1
}

/* live core overlay, aligned to chest core in artwork */
.live-core{
  position:absolute;z-index:3;
  left:51.97%;
  top:41.27%;
  width:11.9%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  overflow:hidden;
  pointer-events:none;
  box-shadow:0 0 calc(10px + 18px*var(--awaken))
    color-mix(in srgb,var(--accent) 45%,transparent);
}
.live-core::before{
  content:"";position:absolute;inset:8%;border-radius:50%;
  background:
    radial-gradient(circle,
      rgba(255,255,255,.34) 0 5%,
      color-mix(in srgb,var(--accent) 66%,transparent) 20%,
      color-mix(in srgb,var(--accent) 34%,transparent) 50%,
      transparent 72%);
  mix-blend-mode:screen;
  animation:corePulse 2.2s ease-in-out infinite;
}
.live-core::after{content:"";display:none}
@keyframes corePulse{
  0%,100%{transform:scale(.96);filter:brightness(.95)}
  50%{transform:scale(calc(1.025 + var(--awaken)*.04));filter:brightness(calc(1.18 + var(--awaken)*.45))}
}
.app.awaken .live-core::before{animation-duration:.65s}
.app.awaken::after{
  content:"";position:absolute;inset:-20%;z-index:2;pointer-events:none;
  background:
    repeating-conic-gradient(from 0deg at 50% 42%,
      color-mix(in srgb,var(--accent) 34%,transparent) 0 2deg,
      transparent 2deg 11deg);
  mask-image:radial-gradient(circle at 50% 42%,black 0 26%,transparent 57%);
  animation:spin 2.6s linear infinite;
  opacity:.85
}
@keyframes spin{to{transform:rotate(360deg)}}

/* invisible artwork-aligned buttons */
.hotspot{
  position:absolute;z-index:6;border:0;background:transparent;padding:0;cursor:pointer
}
.hotspot:active{
  background:rgba(255,191,63,.09);
  box-shadow:inset 0 0 0 1px rgba(255,209,111,.30);
  border-radius:18px
}
#menuBtn{left:2.5%;top:1.2%;width:12%;height:6.5%;border-radius:50%}
#liveBtn{right:2.5%;top:1.2%;width:15%;height:6.5%;border-radius:999px}
#marketBtn{left:4%;bottom:3.0%;width:18%;height:9%}
#walletBtn{left:26%;bottom:3.0%;width:18%;height:9%}
#coreBtn{left:43%;bottom:1.0%;width:14%;height:10%;border-radius:50%}
#explorerBtn{left:59%;bottom:3.0%;width:18%;height:9%}
#settingsBtn{right:3%;bottom:3.0%;width:18%;height:9%}

.ripple{
  position:absolute;border-radius:50%;pointer-events:none;z-index:20;
  background:rgba(90,205,255,.20);
  transform:translate(-50%,-50%) scale(0);
  animation:ripple .45s ease-out forwards
}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(7);opacity:0}}

.live-data{
  position:absolute;z-index:5;left:7%;right:7%;bottom:14.0%;
  padding:11px 15px 12px;border-radius:18px;
  background:linear-gradient(180deg,rgba(7,9,12,.46),rgba(7,9,12,.80));
  border:1px solid rgba(255,197,90,.42);
  backdrop-filter:blur(14px) saturate(1.25);
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 14px 45px rgba(0,0,0,.24)
}
.live-row{display:flex;align-items:end;justify-content:space-between;gap:10px}
.price{
  font-size:clamp(24px,7vw,40px);font-weight:850;letter-spacing:-.04em;
  text-shadow:0 0 12px rgba(255,255,255,.18)
}
.change{
  font-size:clamp(18px,5vw,28px);font-weight:850;color:var(--accent);
  text-shadow:0 0 16px color-mix(in srgb,var(--accent) 55%,transparent)
}
.sub{
  margin-top:5px;display:flex;justify-content:space-between;gap:12px;
  font-size:10px;letter-spacing:.10em;opacity:.72
}
.state{color:var(--accent);font-weight:800}

.backdrop{
  position:absolute;inset:0;z-index:30;
  background:rgba(0,0,0,.52);backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:.18s
}
.backdrop.show{opacity:1;pointer-events:auto}
.panel{
  position:absolute;z-index:31;left:5%;right:5%;bottom:calc(var(--safeB) + 2%);
  max-height:76%;overflow:auto;border-radius:24px;padding:18px;
  background:linear-gradient(180deg,rgba(8,10,15,.97),rgba(12,8,5,.98));
  border:1px solid rgba(255,198,86,.48);
  box-shadow:0 25px 70px rgba(0,0,0,.55),0 0 35px rgba(255,174,42,.11);
  transform:translateY(110%);transition:.22s ease
}
.backdrop.show .panel{transform:translateY(0)}
.panel h2{margin:0 0 12px;font-size:18px;letter-spacing:.08em}
.close{
  float:right;border:1px solid rgba(255,255,255,.18);background:#ffffff0b;color:white;
  border-radius:999px;width:34px;height:34px;font-size:18px
}
.card{
  padding:14px;border:1px solid rgba(255,255,255,.12);
  border-radius:16px;background:#ffffff08;margin-top:10px
}
.label{font-size:10px;letter-spacing:.12em;opacity:.58;margin-bottom:5px}
.big{font-size:26px;font-weight:850}
.mid{font-size:18px;font-weight:800}
.positive{color:#39ff9a}
.negative{color:#ff5a6f}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.action{
  border:1px solid rgba(255,202,105,.32);
  background:linear-gradient(#ffffff0a,#ffb33a0b);
  color:white;border-radius:14px;padding:12px;font-weight:750
}
.action:active{transform:scale(.98);background:#ffffff14}
input,select{
  width:100%;margin-top:8px;padding:12px;border-radius:12px;
  border:1px solid rgba(255,255,255,.16);background:#0a0d12;color:white;font-size:16px
}
.note{font-size:11px;opacity:.62;line-height:1.5}
.statusdot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 12px var(--accent);margin-right:6px
}
.chart-wrap{
  margin-top:10px;border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg,rgba(76,201,255,.06),transparent)
}
canvas{display:block;width:100%;height:210px}
.legend{
  display:flex;justify-content:space-between;gap:8px;
  padding:8px 10px 10px;font-size:10px;opacity:.62
}
.awaken-toast{
  position:absolute;z-index:50;left:50%;top:13%;transform:translateX(-50%) translateY(-20px);
  opacity:0;pointer-events:none;
  padding:9px 14px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--accent) 65%,white 12%);
  background:rgba(2,6,11,.72);backdrop-filter:blur(12px);
  color:white;font-weight:850;letter-spacing:.18em;font-size:11px;
  box-shadow:0 0 28px color-mix(in srgb,var(--accent) 35%,transparent);
  transition:.2s ease
}
.awaken-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage">
    <img class="bg" src="btc-ui.png" alt="BTC CORE">
    <div class="live-core" aria-hidden="true"></div>
  </div>
  <div class="shade"></div>

  <button class="hotspot" id="menuBtn" aria-label="Menu"></button>
  <button class="hotspot" id="liveBtn" aria-label="Live status"></button>
  <button class="hotspot" id="marketBtn" aria-label="Market"></button>
  <button class="hotspot" id="walletBtn" aria-label="Wallet"></button>
  <button class="hotspot" id="coreBtn" aria-label="Refresh BTC / Long press to awaken"></button>
  <button class="hotspot" id="explorerBtn" aria-label="Explorer"></button>
  <button class="hotspot" id="settingsBtn" aria-label="Settings"></button>

  <div class="live-data">
    <div class="live-row">
      <div class="price" id="price">取得中…</div>
      <div class="change" id="change">--.--%</div>
    </div>
    <div class="sub">
      <span id="updated">BTC / JPY</span>
      <span class="state" id="state">CONNECTING</span>
    </div>
  </div>

  <div class="awaken-toast" id="awakenToast">CORE // AWAKENED</div>

  <div class="backdrop" id="backdrop">
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const app=$("app"),backdrop=$("backdrop"),panel=$("panel"),toast=$("awakenToast");

let market={price:null,pct:null,source:"",currency:"JPY"};
let refreshSec=Number(localStorage.getItem("btcRefreshSec")||"60");
let timer=null;
let chartData=[];
let awaken=false;
let longPressTimer=null;
let longPressed=false;

const STATES=[
  {min:5,color:"#ffd34e",name:"GOLD // SURGE"},
  {min:1,color:"#39ff9a",name:"EMERALD // BULL"},
  {min:-1,color:"#4cc9ff",name:"BLUE // NEUTRAL"},
  {min:-5,color:"#a855f7",name:"PURPLE // BEAR"},
  {min:-Infinity,color:"#ff334f",name:"CRIMSON // DANGER"}
];

function paint(pct){
  const s=STATES.find(x=>pct>=x.min);
  document.documentElement.style.setProperty("--accent",s.color);
  $("state").textContent=s.name;
  $("change").textContent=(pct>=0?"+":"")+pct.toFixed(2)+"%";
}

async function fetchMarket(){
  $("state").textContent="CONNECTING";
  try{
    const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=jpy&include_24hr_change=true",{cache:"no-store"});
    if(!r.ok) throw new Error();
    const j=await r.json();
    const price=Number(j?.bitcoin?.jpy),pct=Number(j?.bitcoin?.jpy_24h_change);
    if(!Number.isFinite(price)||!Number.isFinite(pct)) throw new Error();
    market={price,pct,source:"CoinGecko",currency:"JPY"};
    $("price").textContent="¥"+Math.round(price).toLocaleString("ja-JP");
    $("updated").textContent="BTC / JPY • "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
    paint(pct);
    localStorage.setItem("btcCoreMarket",JSON.stringify({...market,time:Date.now()}));
  }catch(e){
    try{
      const [tr,sr]=await Promise.all([
        fetch("https://api.exchange.coinbase.com/products/BTC-USD/ticker",{cache:"no-store"}),
        fetch("https://api.exchange.coinbase.com/products/BTC-USD/stats",{cache:"no-store"})
      ]);
      if(!tr.ok||!sr.ok) throw new Error();
      const t=await tr.json(),s=await sr.json();
      const price=Number(t.price),open=Number(s.open),pct=(price/open-1)*100;
      if(!Number.isFinite(price)||!Number.isFinite(pct)) throw new Error();
      market={price,pct,source:"Coinbase",currency:"USD"};
      $("price").textContent="$"+Math.round(price).toLocaleString("en-US");
      $("updated").textContent="BTC / USD • "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
      paint(pct);
    }catch(_){
      const last=JSON.parse(localStorage.getItem("btcCoreMarket")||"null");
      if(last?.price && Number.isFinite(last?.pct)){
        market=last;
        $("price").textContent=(last.currency==="USD"?"$":"¥")+Math.round(last.price).toLocaleString(last.currency==="USD"?"en-US":"ja-JP");
        $("updated").textContent="CACHED DATA";
        paint(last.pct);
      }else{
        $("state").textContent="OFFLINE";
      }
    }
  }
}

async function fetchChart(){
  try{
    const r=await fetch("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=jpy&days=7&interval=hourly",{cache:"no-store"});
    if(!r.ok) throw new Error();
    const j=await r.json();
    chartData=(j.prices||[]).map(p=>({t:p[0],p:p[1]})).filter(x=>Number.isFinite(x.p));
  }catch(e){
    chartData=[];
  }
}

function schedule(){
  clearInterval(timer);
  timer=setInterval(fetchMarket,refreshSec*1000);
}

function ripple(e){
  const r=document.createElement("span");
  r.className="ripple";
  const rect=app.getBoundingClientRect();
  r.style.left=(e.clientX-rect.left)+"px";
  r.style.top=(e.clientY-rect.top)+"px";
  app.appendChild(r);
  setTimeout(()=>r.remove(),500);
}
document.querySelectorAll(".hotspot").forEach(b=>b.addEventListener("click",e=>{
  if(b.id!=="coreBtn") ripple(e);
}));

function openPanel(html){
  panel.innerHTML=html;
  backdrop.classList.add("show");
}
function closePanel(){backdrop.classList.remove("show")}
backdrop.addEventListener("click",e=>{if(e.target===backdrop)closePanel()});
function closeButton(){return `<button class="close" onclick="closePanel()">×</button>`}

function fmtMoney(v,currency="JPY"){
  if(!Number.isFinite(v)) return "--";
  return currency==="USD" ? "$"+Math.round(v).toLocaleString("en-US") : "¥"+Math.round(v).toLocaleString("ja-JP");
}

function showMarket(){
  const p=market.price;
  const pct=market.pct;
  openPanel(`${closeButton()}<h2>MARKET</h2>
    <div class="card">
      <div class="label">BITCOIN PRICE</div>
      <div class="big">${p?fmtMoney(p,market.currency):"--"}</div>
    </div>
    <div class="card">
      <div class="label">24H CHANGE</div>
      <div class="big ${pct>=0?"positive":"negative"}">${pct==null?"--":((pct>=0?"+":"")+pct.toFixed(2)+"%")}</div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart" width="700" height="320"></canvas>
      <div class="legend"><span>7 DAYS</span><span id="chartRange">読み込み中…</span></div>
    </div>
    <div class="actions">
      <button class="action" onclick="refreshMarketPanel()">更新</button>
      <button class="action" onclick="closePanel()">閉じる</button>
    </div>`);
  fetchChart().then(drawChart);
}

async function refreshMarketPanel(){
  await Promise.all([fetchMarket(),fetchChart()]);
  showMarket();
}

function drawChart(){
  const c=document.getElementById("chart");
  if(!c) return;
  const ctx=c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  if(chartData.length<2){
    ctx.fillStyle="rgba(255,255,255,.6)";
    ctx.font="24px -apple-system";
    ctx.fillText("チャート取得に失敗しました",35,160);
    const range=document.getElementById("chartRange");
    if(range) range.textContent="NO DATA";
    return;
  }
  const vals=chartData.map(x=>x.p);
  const min=Math.min(...vals),max=Math.max(...vals);
  const padX=34,padY=28,w=c.width-padX*2,h=c.height-padY*2;
  const x=i=>padX+(i/(chartData.length-1))*w;
  const y=v=>padY+(1-(v-min)/((max-min)||1))*h;

  // grid
  ctx.strokeStyle="rgba(255,255,255,.08)";
  ctx.lineWidth=1;
  for(let i=0;i<5;i++){
    const yy=padY+i*h/4;
    ctx.beginPath();ctx.moveTo(padX,yy);ctx.lineTo(padX+w,yy);ctx.stroke();
  }

  // area
  const grad=ctx.createLinearGradient(0,padY,0,padY+h);
  grad.addColorStop(0,"rgba(76,201,255,.28)");
  grad.addColorStop(1,"rgba(76,201,255,0)");
  ctx.beginPath();
  ctx.moveTo(x(0),y(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(x(i),y(vals[i]));
  ctx.lineTo(x(vals.length-1),padY+h);
  ctx.lineTo(x(0),padY+h);
  ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();

  // line
  ctx.beginPath();
  ctx.moveTo(x(0),y(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(x(i),y(vals[i]));
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#4cc9ff";
  ctx.lineWidth=4;ctx.shadowBlur=16;ctx.shadowColor=ctx.strokeStyle;ctx.stroke();
  ctx.shadowBlur=0;

  const range=document.getElementById("chartRange");
  if(range) range.textContent=fmtMoney(min)+" → "+fmtMoney(max);
}

function showWallet(){
  const hold=Number(localStorage.getItem("btcHoldings")||"0");
  const avg=Number(localStorage.getItem("btcAvgCost")||"0");
  openPanel(`${closeButton()}<h2>WALLET</h2>
    <div class="card">
      <div class="label">BTC HOLDINGS</div>
      <input id="holdInput" type="number" step="0.00000001" min="0" value="${hold||""}" placeholder="例 0.7">
      <div class="label" style="margin-top:10px">AVERAGE COST / BTC (JPY)</div>
      <input id="avgInput" type="number" step="1" min="0" value="${avg||""}" placeholder="平均取得単価">
      <div class="note">入力値はこの端末内だけに保存されます。</div>
    </div>
    <div class="card">
      <div class="label">CURRENT VALUE</div>
      <div class="big" id="walletValue">--</div>
    </div>
    <div class="card">
      <div class="label">UNREALIZED P/L</div>
      <div class="big" id="walletPL">--</div>
      <div class="mid" id="walletPLPct">--</div>
    </div>
    <div class="actions">
      <button class="action" onclick="saveWallet()">保存・計算</button>
      <button class="action" onclick="closePanel()">閉じる</button>
    </div>`);
  updateWalletPreview();
  document.getElementById("holdInput").addEventListener("input",updateWalletPreview);
  document.getElementById("avgInput").addEventListener("input",updateWalletPreview);
}

function updateWalletPreview(){
  const h=Number(document.getElementById("holdInput")?.value||0);
  const avg=Number(document.getElementById("avgInput")?.value||0);
  const valEl=document.getElementById("walletValue");
  const plEl=document.getElementById("walletPL");
  const pctEl=document.getElementById("walletPLPct");
  if(!valEl||!plEl||!pctEl) return;

  if(market.currency!=="JPY" || !Number.isFinite(market.price)){
    valEl.textContent="JPY価格取得後に計算";
    plEl.textContent="--";
    pctEl.textContent="--";
    return;
  }
  const current=h*market.price;
  const cost=h*avg;
  const pl=current-cost;
  const pct=cost>0?(pl/cost)*100:null;

  valEl.textContent=h>0?fmtMoney(current):"--";
  plEl.textContent=(h>0&&avg>0)?((pl>=0?"+":"")+fmtMoney(Math.abs(pl))):"--";
  plEl.className="big "+(pl>=0?"positive":"negative");
  pctEl.textContent=pct==null?"--":((pct>=0?"+":"")+pct.toFixed(2)+"%");
  pctEl.className="mid "+(pct>=0?"positive":"negative");
}

function saveWallet(){
  const h=Math.max(0,Number(document.getElementById("holdInput").value)||0);
  const avg=Math.max(0,Number(document.getElementById("avgInput").value)||0);
  localStorage.setItem("btcHoldings",String(h));
  localStorage.setItem("btcAvgCost",String(avg));
  updateWalletPreview();
}

function showExplorer(){
  openPanel(`${closeButton()}<h2>EXPLORER</h2>
    <div class="card">
      <div class="label">BITCOIN NETWORK</div>
      <div class="big">BLOCK EXPLORER</div>
      <div class="note">外部サイトを開いてブロック・トランザクションを確認します。</div>
    </div>
    <div class="actions">
      <button class="action" onclick="window.open('https://mempool.space/ja/','_blank')">mempool.space</button>
      <button class="action" onclick="closePanel()">閉じる</button>
    </div>`);
}

function showSettings(){
  openPanel(`${closeButton()}<h2>SETTINGS</h2>
    <div class="card">
      <div class="label">PRICE UPDATE</div>
      <select id="refreshSelect">
        <option value="30" ${refreshSec===30?"selected":""}>30秒</option>
        <option value="60" ${refreshSec===60?"selected":""}>60秒</option>
        <option value="120" ${refreshSec===120?"selected":""}>2分</option>
        <option value="300" ${refreshSec===300?"selected":""}>5分</option>
      </select>
    </div>
    <div class="card">
      <div class="label">CORE MODE</div>
      <div class="note">中央BTCボタンを約0.8秒長押しすると覚醒モード。もう一度長押しすると解除。</div>
    </div>
    <div class="actions">
      <button class="action" onclick="saveSettings()">保存</button>
      <button class="action" onclick="closePanel()">閉じる</button>
    </div>`);
}
function saveSettings(){
  refreshSec=Number(document.getElementById("refreshSelect").value)||60;
  localStorage.setItem("btcRefreshSec",String(refreshSec));
  schedule();closePanel();
}

function toggleAwaken(){
  awaken=!awaken;
  app.classList.toggle("awaken",awaken);
  document.documentElement.style.setProperty("--awaken",awaken?1:0);
  toast.textContent=awaken?"CORE // AWAKENED":"CORE // NORMAL";
  toast.classList.add("show");
  if(navigator.vibrate) navigator.vibrate(awaken?[40,60,90]:40);
  setTimeout(()=>toast.classList.remove("show"),1200);
  localStorage.setItem("btcAwaken",awaken?"1":"0");
}

$("menuBtn").onclick=e=>{
  ripple(e);
  openPanel(`${closeButton()}<h2>BTC // CORE</h2>
    <div class="card">
      <div class="label">SYSTEM</div>
      <div class="big"><span class="statusdot"></span>ONLINE</div>
      <div class="note">MARKETで7日チャート、WALLETで含み損益、中央BTC長押しで覚醒モード。</div>
    </div>
    <div class="actions">
      <button class="action" onclick="showMarket()">MARKET</button>
      <button class="action" onclick="showWallet()">WALLET</button>
      <button class="action" onclick="showExplorer()">EXPLORER</button>
      <button class="action" onclick="showSettings()">SETTINGS</button>
    </div>`);
};

$("liveBtn").onclick=e=>{
  ripple(e);
  openPanel(`${closeButton()}<h2>LIVE STATUS</h2>
    <div class="card"><div class="label">DATA SOURCE</div><div class="big">${market.source||"CONNECTING"}</div></div>
    <div class="card"><div class="label">UPDATE INTERVAL</div><div class="big">${refreshSec} sec</div></div>
    <div class="card"><div class="label">CORE</div><div class="big">${awaken?"AWAKENED":"NORMAL"}</div></div>`);
};

$("marketBtn").onclick=e=>{ripple(e);showMarket()};
$("walletBtn").onclick=e=>{ripple(e);showWallet()};
$("explorerBtn").onclick=e=>{ripple(e);showExplorer()};
$("settingsBtn").onclick=e=>{ripple(e);showSettings()};

const coreBtn=$("coreBtn");
function startLongPress(e){
  e.preventDefault();
  longPressed=false;
  longPressTimer=setTimeout(()=>{
    longPressed=true;
    toggleAwaken();
  },800);
}
function cancelLongPress(e){
  clearTimeout(longPressTimer);
}
coreBtn.addEventListener("pointerdown",startLongPress);
coreBtn.addEventListener("pointerup",async e=>{
  clearTimeout(longPressTimer);
  if(!longPressed){
    ripple(e);
    if(navigator.vibrate) navigator.vibrate(25);
    $("state").textContent="REFRESHING";
    await fetchMarket();
  }
});
coreBtn.addEventListener("pointercancel",cancelLongPress);
coreBtn.addEventListener("pointerleave",cancelLongPress);

awaken=localStorage.getItem("btcAwaken")==="1";
app.classList.toggle("awaken",awaken);
document.documentElement.style.setProperty("--awaken",awaken?1:0);

fetchMarket();
schedule();

</script>
</body>
</html>
